[platformio]
default_envs = adaptive

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    adafruit/Adafruit BME280 Library
    adafruit/Adafruit Unified Sensor

[env:adaptive]
build_flags = -DADAPTIVE=1
build_src_filter = -<*> +<main.cpp>

[env:fixed]
build_flags = -DADAPTIVE=0
build_src_filter = -<*> +<main.cpp>

[env:i2c_check]
build_src_filter = -<*> +<i2c_check.cpp>
